<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleischer Departures</title>
<meta name="description" content="William &amp; Elissa's trips — itineraries, budgets, and what's next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --board:#1c2724; --panel:#232f2b; --panel-edge:#2c3a35;
    --ivory:#efe7d5; --muted:#93a49b; --brass:#c8a45f; --brass-soft:#8a744a;
    --line:#37443f;
  }
  *{box-sizing:border-box;}
  html{background:var(--board);}
  body{
    margin:0; background:var(--board); color:var(--ivory);
    font-family:Georgia,"Times New Roman",serif; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:780px; margin:0 auto; padding:52px 22px 64px;}
  header{text-align:center; margin-bottom:40px;}
  .over{
    font-family:"IBM Plex Mono",Menlo,monospace; font-size:11.5px; letter-spacing:.32em;
    color:var(--brass); text-transform:uppercase;
  }
  h1{
    font-family:Marcellus,Georgia,serif; font-weight:400; font-size:clamp(38px,7vw,54px);
    margin:10px 0 6px; letter-spacing:.04em; text-wrap:balance; color:var(--ivory);
  }
  .subtitle{color:var(--muted); font-style:italic; font-size:15.5px;}
  .rule{
    display:flex; align-items:center; gap:14px; margin:38px 0 18px;
    font-family:"IBM Plex Mono",Menlo,monospace; font-size:12px; letter-spacing:.26em;
    text-transform:uppercase; color:var(--brass);
  }
  .rule::before,.rule::after{content:""; flex:1; border-top:1px solid var(--line);}
  .empty{
    border:1px dashed var(--line); border-radius:10px; padding:26px 22px; text-align:center;
    color:var(--muted); font-style:italic; background:transparent;
  }
  .trip{
    display:grid; grid-template-columns:118px 1fr auto; gap:0 20px; align-items:center;
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px;
    padding:20px 22px; margin-bottom:14px; text-decoration:none; color:var(--ivory);
    transition:border-color .15s ease;
  }
  .trip:hover,.trip:focus-visible{border-color:var(--brass-soft); outline:none;}
  .trip:focus-visible{box-shadow:0 0 0 2px var(--brass);}
  .dates{
    font-family:"IBM Plex Mono",Menlo,monospace; font-size:13px; color:var(--brass);
    line-height:1.5; font-variant-numeric:tabular-nums;
  }
  .dates .yr{color:var(--muted); font-size:11.5px;}
  .tname{font-family:Marcellus,Georgia,serif; font-size:21px; letter-spacing:.01em; margin:0 0 2px;}
  .tsub{color:var(--muted); font-size:14px;}
  .troute{
    font-family:"IBM Plex Mono",Menlo,monospace; font-size:12px; color:var(--muted);
    margin-top:7px; letter-spacing:.06em;
  }
  .tlinks{margin-top:9px; font-family:"IBM Plex Mono",Menlo,monospace; font-size:12.5px;}
  .tlinks a{color:var(--brass); text-decoration:none; border-bottom:1px solid var(--brass-soft); padding-bottom:1px;}
  .tlinks a:hover,.tlinks a:focus-visible{color:var(--ivory); border-color:var(--ivory); outline:none;}
  .tlinks .sep{color:var(--line); margin:0 8px;}
  .chip{
    font-family:"IBM Plex Mono",Menlo,monospace; font-size:10.5px; letter-spacing:.22em;
    text-transform:uppercase; padding:5px 10px 4px; border-radius:3px; white-space:nowrap;
    align-self:start; margin-top:4px;
  }
  .chip.upcoming{color:#1c2724; background:var(--brass);}
  .chip.now{color:var(--brass); border:1px solid var(--brass);}
  .chip.past{color:var(--muted); border:1px solid var(--line);}
  footer{
    margin-top:52px; text-align:center; color:var(--muted); font-size:13px; font-style:italic;
  }
  footer a{color:var(--brass); text-decoration:none;}
  @media (max-width:600px){
    .trip{grid-template-columns:1fr; gap:10px;}
    .chip{justify-self:start; margin-top:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .trip{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="over">William &amp; Elissa</div>
    <h1>Departures</h1>
    <div class="subtitle">Every trip, from first flight out of Dallas to the last night home.</div>
  </header>

  <div class="rule" id="next-label">Up Next</div>
  <div id="upcoming"></div>

  <div class="rule">Past Trips</div>
  <div id="past"></div>

  <footer>Itineraries, day-by-day weather, and budgets live inside each trip.</footer>
</div>

<script>
  var TRIPS = [
    {
      slug: "rockies-2026",
      name: "The Wedding Week & Honeymoon",
      sub: "Banff · Lake Louise · Jasper — married at Fairmont Chateau Lake Louise",
      route: "DFW → YYC · AA 1973",
      start: "2026-07-22", end: "2026-08-02",
      display: "Jul 22 – Aug 2", year: "2026",
      itinerary: "rockies-2026/", budget: "rockies-2026/budget.html"
    }
  ];

  function today(){ return new Date().toISOString().slice(0,10); }
  function row(t, status){
    var chip = status === "now" ? '<span class="chip now">In Progress</span>'
             : status === "upcoming" ? '<span class="chip upcoming">Upcoming</span>'
             : '<span class="chip past">Completed</span>';
    return '<div class="trip">' +
      '<div class="dates">' + t.display + '<br><span class="yr">' + t.year + '</span></div>' +
      '<div><div class="tname">' + t.name + '</div>' +
        '<div class="tsub">' + t.sub + '</div>' +
        '<div class="troute">' + t.route + '</div>' +
        '<div class="tlinks"><a href="' + t.itinerary + '">Itinerary</a>' +
        '<span class="sep">·</span><a href="' + t.budget + '">Budget</a></div></div>' +
      chip + '</div>';
  }
  (function(){
    var d = today();
    var upcoming = TRIPS.filter(function(t){ return t.end >= d; })
                        .sort(function(a,b){ return a.start < b.start ? -1 : 1; });
    var past = TRIPS.filter(function(t){ return t.end < d; })
                    .sort(function(a,b){ return a.end > b.end ? -1 : 1; });
    var up = document.getElementById("upcoming");
    up.innerHTML = upcoming.length
      ? upcoming.map(function(t){ return row(t, t.start <= d ? "now" : "upcoming"); }).join("")
      : '<div class="empty">Nothing on the board — the next adventure is still being planned.</div>';
    if (upcoming.length && upcoming[0].start <= d)
      document.getElementById("next-label").textContent = "Now Traveling";
    document.getElementById("past").innerHTML =
      past.map(function(t){ return row(t, "past"); }).join("");
  })();
</script>
</body>
</html>
